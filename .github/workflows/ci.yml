name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: "3.11"
      - name: Install Python dependencies
        run: uv sync --frozen --all-groups
      - name: Ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: mypy
        run: uv run mypy
      - name: pytest
        run: uv run pytest -m "not media and not transcription and not vision and not candidate and not preview and not review and not hero and not model_smoke"
      - name: Schema check
        run: uv run clipforge schema check
      - name: Doctor
        run: uv run clipforge doctor

  # ubuntu-24.04 is pinned so apt's ffmpeg stays reproducible. ubuntu-latest
  # moves to Ubuntu 26 on 2026-10-19. The other jobs stay on ubuntu-latest.
  media:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: "3.11"
      - name: Install Python dependencies
        run: uv sync --frozen --all-groups
      - name: Install FFmpeg from Ubuntu packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Media integration tests
        run: uv run pytest -m media

  transcription:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: "3.11"
      - name: Install Python dependencies
        run: uv sync --frozen --all-groups
      - name: Import the ASR packages without loading a model
        run: uv run python -c "import faster_whisper, ctranslate2"
      - name: Deterministic transcription tests
        run: uv run pytest -m transcription

  vision:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: "3.11"
      - name: Install Python dependencies
        run: uv sync --frozen --all-groups
      - name: Install FFmpeg from Ubuntu packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Import visual-analysis packages without downloading a model
        run: uv run python -c "import scenedetect, cv2, av, mediapipe"
      - name: Vision tests
        run: uv run pytest -m vision

  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: "3.11"
      - name: Install Python dependencies
        run: uv sync --frozen --all-groups
      - name: Candidate mining tests
        run: uv run pytest -m candidate

  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: "3.11"
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/renderer/pnpm-lock.yaml
      - name: Install FFmpeg and a system browser
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          if ! command -v google-chrome && ! command -v google-chrome-stable && ! command -v chromium && ! command -v chromium-browser; then
            sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
          fi
      - name: Install Python dependencies
        run: uv sync --frozen --all-groups
      - name: Install renderer dependencies
        working-directory: apps/renderer
        run: pnpm install --frozen-lockfile
      - name: Rough preview tests
        run: uv run pytest -m preview

  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: "3.11"
      - name: Install FFmpeg from Ubuntu packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python dependencies
        run: uv sync --frozen --all-groups
      - name: Candidate review tests
        run: uv run pytest -m review

  hero:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: "3.11"
      - name: Install FFmpeg from Ubuntu packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python dependencies
        run: uv sync --frozen --all-groups
      - name: Hero draft tests
        run: uv run pytest -m hero

  renderer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/renderer
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/renderer/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint, typecheck, test
        run: pnpm lint && pnpm typecheck && pnpm test
