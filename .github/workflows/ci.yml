name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: clipforge-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-python:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, clipforge]
    env:
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Check local tools
        run: |
          set -euo pipefail
          started=$SECONDS
          export UV_CACHE_DIR="${HOME}/.cache/clipforge/uv"
          echo "UV_CACHE_DIR=${UV_CACHE_DIR}" >> "$GITHUB_ENV"
          python3 -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 11) else 1)'
          command -v uv
          command -v ffmpeg
          command -v ffprobe
          uv --version
          ffmpeg -version | head -n 1
          if [ -n "$(find "$UV_CACHE_DIR" -mindepth 1 -print -quit 2>/dev/null)" ]; then
            echo "uv_cache=hit" >> "$GITHUB_ENV"
          else
            echo "uv_cache=miss" >> "$GITHUB_ENV"
          fi
          echo "tool_check_seconds=$((SECONDS - started))" >> "$GITHUB_ENV"

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          started=$SECONDS
          mkdir -p "$UV_CACHE_DIR"
          uv sync --frozen --all-groups
          echo "python_setup_seconds=$((SECONDS - started))" >> "$GITHUB_ENV"

      - name: Ruff, mypy, schema, and doctor
        run: |
          set -euo pipefail
          started=$SECONDS
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run clipforge schema check
          uv run clipforge doctor
          echo "python_checks_seconds=$((SECONDS - started))" >> "$GITHUB_ENV"

      - name: Python tests
        run: |
          set -euo pipefail
          started=$SECONDS
          uv run pytest -m "not browser and not model_smoke" --override-ini addopts="-q -ra"
          echo "pytest_seconds=$((SECONDS - started))" >> "$GITHUB_ENV"

      - name: Record Python timing
        if: always()
        run: |
          {
            echo "### verify-python"
            echo "- runner: self-hosted, linux, x64, clipforge"
            echo "- uv cache: ${uv_cache:-unknown}"
            echo "- tool check: ${tool_check_seconds:-0}s"
            echo "- dependency setup: ${python_setup_seconds:-0}s"
            echo "- ruff, mypy, schema, doctor: ${python_checks_seconds:-0}s"
            echo "- pytest excluding browser and model_smoke: ${pytest_seconds:-0}s"
            echo "- actions cache upload: none"
          } >> "$GITHUB_STEP_SUMMARY"

  verify-renderer:
    needs: verify-python
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, clipforge]
    env:
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - uses: actions/checkout@v7
      - name: Check renderer tools
        run: |
          set -euo pipefail
          started=$SECONDS
          export UV_CACHE_DIR="${HOME}/.cache/clipforge/uv"
          echo "UV_CACHE_DIR=${UV_CACHE_DIR}" >> "$GITHUB_ENV"
          command -v node
          command -v pnpm
          command -v ffmpeg
          command -v ffprobe
          command -v uv
          command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser
          node -v
          pnpm -v
          store="${HOME}/.cache/clipforge/pnpm"
          if [ -n "$(find "$store" -mindepth 1 -print -quit 2>/dev/null)" ]; then
            echo "pnpm_cache=hit" >> "$GITHUB_ENV"
          else
            echo "pnpm_cache=miss" >> "$GITHUB_ENV"
          fi
          echo "renderer_tool_seconds=$((SECONDS - started))" >> "$GITHUB_ENV"

      - name: Install renderer dependencies
        working-directory: apps/renderer
        run: |
          set -euo pipefail
          started=$SECONDS
          mkdir -p "${HOME}/.cache/clipforge/pnpm"
          pnpm install --frozen-lockfile --store-dir "${HOME}/.cache/clipforge/pnpm"
          echo "renderer_setup_seconds=$((SECONDS - started))" >> "$GITHUB_ENV"

      - name: Renderer lint, typecheck, and Vitest
        working-directory: apps/renderer
        run: |
          set -euo pipefail
          started=$SECONDS
          pnpm lint
          pnpm typecheck
          pnpm test
          echo "renderer_checks_seconds=$((SECONDS - started))" >> "$GITHUB_ENV"

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          started=$SECONDS
          mkdir -p "$UV_CACHE_DIR"
          uv sync --frozen --all-groups
          echo "browser_setup_seconds=$((SECONDS - started))" >> "$GITHUB_ENV"

      - name: Browser and Remotion smoke
        run: |
          set -euo pipefail
          started=$SECONDS
          uv run pytest -m browser --override-ini addopts="-q -ra"
          echo "browser_seconds=$((SECONDS - started))" >> "$GITHUB_ENV"

      - name: Record renderer timing
        if: always()
        run: |
          {
            echo "### verify-renderer"
            echo "- runner: self-hosted, linux, x64, clipforge"
            echo "- pnpm store: ${pnpm_cache:-unknown}"
            echo "- tool check: ${renderer_tool_seconds:-0}s"
            echo "- renderer install: ${renderer_setup_seconds:-0}s"
            echo "- lint, typecheck, vitest: ${renderer_checks_seconds:-0}s"
            echo "- python setup for browser smoke: ${browser_setup_seconds:-0}s"
            echo "- browser smoke: ${browser_seconds:-0}s"
            echo "- browser concurrency: 1"
            echo "- actions cache upload: none"
          } >> "$GITHUB_STEP_SUMMARY"
