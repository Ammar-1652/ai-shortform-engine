[project]
name = "clipforge"
version = "0.1.0"
description = "Local-first short-form video production engine."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper==1.2.1",
    "pydantic>=2.10,<3",
    "typer>=0.15,<1",
]

[project.scripts]
clipforge = "clipforge.cli.main:app"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "media: tests that execute ffmpeg or ffprobe",
    "transcription: deterministic transcription tests with a fake backend and no model download",
    "model_smoke: local faster-whisper weight tests, excluded from CI",
]

[tool.ruff]
target-version = "py311"
line-length = 112
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["clipforge"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["clipforge"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
warn_unused_ignores = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = [
    "faster_whisper",
    "faster_whisper.*",
    "ctranslate2",
    "ctranslate2.*",
    "huggingface_hub",
    "huggingface_hub.*",
    "av",
    "av.*",
    "tokenizers",
    "tokenizers.*",
    "onnxruntime",
    "onnxruntime.*",
    "tqdm",
    "numpy",
    "numpy.*",
]
ignore_missing_imports = true
