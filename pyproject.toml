[project]
name = "clipforge"
version = "0.1.0"
description = "Local-first short-form video production engine."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper==1.2.1",
    "mediapipe==1.0.1",
    "pydantic>=2.10,<3",
    "scenedetect-headless==0.7.1",
    "typer>=0.15,<1",
]

[project.scripts]
clipforge = "clipforge.cli.main:app"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# MediaPipe requires opencv-contrib-python. scenedetect-headless requires
# opencv-python-headless. Both publish the cv2 package, so installing both
# leaves namespace ownership to install order. Keep the contrib wheel, which
# supplies the core cv2 API PySceneDetect calls, and do not install the
# headless wheel beside it.
[[tool.uv.dependency-metadata]]
name = "scenedetect-headless"
version = "0.7.1"
requires-dist = [
    "click!=8.3.0,~=8.0",
    "numpy",
    "opencv-contrib-python",
    "platformdirs",
    "tqdm",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "media: tests that execute ffmpeg or ffprobe",
    "transcription: deterministic transcription tests with a fake backend and no model download",
    "vision: PySceneDetect, PyAV, and OpenCV tests with a fake face backend and no model download",
    "candidate: deterministic candidate-mining tests with no model download and no video decode",
    "preview: rough preview tests; the real render smoke is the only test that launches a browser",
    "review: local review-surface tests; the browser smoke uses an already installed browser",
    "model_smoke: local model-weight tests, excluded from CI",
]

[tool.ruff]
target-version = "py311"
line-length = 112
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["clipforge"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["clipforge"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
warn_unused_ignores = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = [
    "faster_whisper",
    "faster_whisper.*",
    "ctranslate2",
    "ctranslate2.*",
    "huggingface_hub",
    "huggingface_hub.*",
    "av",
    "av.*",
    "tokenizers",
    "tokenizers.*",
    "onnxruntime",
    "onnxruntime.*",
    "tqdm",
    "numpy",
    "numpy.*",
    "cv2",
    "cv2.*",
    "mediapipe",
    "mediapipe.*",
    "scenedetect",
    "scenedetect.*",
]
ignore_missing_imports = true
