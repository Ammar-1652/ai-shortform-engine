[project]
name = "clipforge"
version = "0.1.0"
description = "Local-first short-form video production engine. Round 1 is the foundation only."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10,<3",
    "typer>=0.15,<1",
]

[project.scripts]
clipforge = "clipforge.cli.main:app"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 112
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["clipforge"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["clipforge"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
warn_unused_ignores = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
